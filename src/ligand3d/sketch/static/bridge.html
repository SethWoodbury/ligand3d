<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ligand3d — sketch</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #5c6370;
    --border: #d8dce3;
    --accent: #2f6f4f;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e8eaee; --muted: #9aa2ae;
      --border: #2e333c; --accent: #4c9a72; --accent-fg: #0d0f12;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 1rem;
    padding: .7rem 1rem; border-bottom: 1px solid var(--border); flex: none;
  }
  h1 { font-size: 1rem; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: .82rem; }
  .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: .5rem 1.1rem; border-radius: 6px;
    border: 1px solid transparent; background: var(--accent); color: var(--accent-fg);
  }
  button.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  #frame { flex: 1; border: 0; width: 100%; }
  #status {
    padding: .6rem 1rem; border-top: 1px solid var(--border);
    color: var(--muted); font-size: .82rem; flex: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #status.error { color: #c0392b; }
  #status.ok { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>ligand3d</h1>
  <span class="hint">Draw a molecule, including stereo bonds, then send it back to the terminal.</span>
  <span class="spacer"></span>
  <button id="send">Use this molecule</button>
</header>

<iframe id="frame" src="/ketcher/index.html"></iframe>
<div id="status">waiting for the sketcher to load…</div>

<script>
const statusEl = document.getElementById('status');
const sendBtn = document.getElementById('send');
const frame = document.getElementById('frame');

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = kind || '';
}

function ketcher() {
  try {
    return frame.contentWindow && frame.contentWindow.ketcher;
  } catch (e) {
    return null;
  }
}

// Ketcher attaches window.ketcher asynchronously after its bundle boots.
let waited = 0;
const poll = setInterval(() => {
  if (ketcher()) {
    clearInterval(poll);
    setStatus('ready — draw a structure, then press "Use this molecule"');
  } else if ((waited += 250) > 30000) {
    clearInterval(poll);
    setStatus('sketcher did not initialize; reload the page', 'error');
  }
}, 250);

sendBtn.addEventListener('click', async () => {
  const k = ketcher();
  if (!k) { setStatus('sketcher is not ready yet', 'error'); return; }

  sendBtn.disabled = true;
  try {
    const molblock = await k.getMolfile();
    if (!molblock || !molblock.trim()) {
      setStatus('the canvas is empty — draw something first', 'error');
      sendBtn.disabled = false;
      return;
    }
    let smiles = '';
    try { smiles = await k.getSmiles(); } catch (e) { /* optional */ }

    const response = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ molblock, smiles }),
    });
    if (!response.ok) throw new Error('server returned ' + response.status);

    setStatus('sent' + (smiles ? ': ' + smiles : '') + ' — you can close this tab', 'ok');
    sendBtn.textContent = 'Sent';
  } catch (err) {
    setStatus('could not send: ' + err.message, 'error');
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
