[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ligand3d"
version = "0.3.0"
description = "Turn a 2D molecule into a minimized 3D structure"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Seth M. Woodbury", email = "woodbuse@uw.edu" }]
keywords = ["chemistry", "cheminformatics", "rdkit", "conformers", "force-field"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.9",
    "numpy>=1.24",
    "typer>=0.12",
    "rich>=13.0",
    "gemmi>=0.6",  # mmCIF read and write
]

[project.optional-dependencies]
# Semi-empirical tier. tblite ships manylinux wheels; no compiler needed.
xtb = ["tblite>=0.4", "ase>=3.22"]
# Machine-learned potentials. Install torch from the CPU index first if you do not
# have a GPU, otherwise pip pulls the multi-GB CUDA build:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
#
# NOTE: [mace] and [fairchem] CANNOT share an environment. mace-torch pins
# e3nn==0.4.4 and fairchem-core requires e3nn>=0.5. Install them in separate
# virtualenvs; `ligand3d doctor` detects the clash and says so.
mace = ["ase>=3.22", "torch>=2.0", "mace-torch>=0.3.16"]
# fairchem-core supports only 3.11-3.13, while ligand3d itself runs on 3.10+.
# Without the marker, resolving this extra fails on 3.10 rather than simply
# leaving the backend unavailable there.
fairchem = [
    "ase>=3.22",
    "torch>=2.0",
    "fairchem-core>=2.20; python_version >= '3.11' and python_version < '3.14'",
]
aimnet = ["ase>=3.22", "torch>=2.0"]
mlff = ["ase>=3.22", "torch>=2.0", "mace-torch>=0.3.16"]  # alias for [mace]
protonation = ["dimorphite-dl>=2.0"]
# Offline IUPAC name parsing for `ligand3d fetch` and the sketcher's import box.
# py2opsin is a thin wrapper that ships the OPSIN jar and shells out to `java`,
# so a JRE has to be on PATH; without it the PubChem route still works, and
# without either, SMILES and InChI still do.
names = ["py2opsin>=1.2"]
# Everything that can coexist: the MACE side of the MLFF split.
all = [
    "tblite>=0.4",
    "ase>=3.22",
    "torch>=2.0",
    "mace-torch>=0.3.16",
    "dimorphite-dl>=2.0",
    "py2opsin>=1.2",
]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
ligand3d = "ligand3d.cli:app"

[project.urls]
Homepage = "https://github.com/SethWoodbury/ligand3d"
Issues = "https://github.com/SethWoodbury/ligand3d/issues"

[tool.uv]
# mace-torch pins e3nn==0.4.4 and fairchem-core needs e3nn>=0.5, so these extras
# genuinely cannot be resolved together. Declaring it here is what stops `uv
# run` and `uv lock` from trying: without it they attempt to satisfy every extra
# at once and fail with an unsatisfiable-requirements error that looks like a
# broken project rather than a deliberate split.
conflicts = [
    [{ extra = "mace" }, { extra = "fairchem" }],
    [{ extra = "mlff" }, { extra = "fairchem" }],
    [{ extra = "all" }, { extra = "fairchem" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/ligand3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "backend: test requires an optional minimization backend",
    "slow: test takes more than a few seconds",
    "network: test calls a third-party service; deselected by default",
]
# PubChem being slow or down is not a reason for the suite to fail, so the
# tests that talk to it are opt-in: `pytest -m network`.
addopts = "-q --strict-markers -m 'not network'"
