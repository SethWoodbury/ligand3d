name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `uv run` re-syncs the environment from pyproject before running, which means
# it tries to satisfy every declared extra at once — including the mace/fairchem
# pair that cannot coexist. Every job here installs explicitly and then calls the
# venv's own pytest, so the test command can never re-resolve.
env:
  UV_NO_SYNC: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install with the semi-empirical and protonation extras
        # The ML potentials are deliberately excluded: they pull multi-gigabyte
        # torch wheels, and their backends skip cleanly when absent.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,xtb,protonation]"

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  core-only:
    # The core install must stand on its own: someone who wants nothing but
    # 2D -> 3D and MMFF94 should not need tblite, dimorphite-dl, or torch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q
      - name: Build both target molecules with no optional dependencies
        run: |
          .venv/bin/ligand3d build "O=C1CN2CCC1CC2" -o quinuclidinone
          .venv/bin/ligand3d build "NCC1(CC(=O)O)CCCCC1" -o gabapentin
          test -s quinuclidinone.cif
          test -s gabapentin.cif
      - name: Doctor should report cleanly with nothing optional installed
        run: .venv/bin/ligand3d doctor

  extras-resolve:
    # The mace and fairchem extras are mutually exclusive by design. This proves
    # each one still resolves on its own, so a dependency bump cannot quietly
    # break an install path nobody exercises until they need it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [mace, fairchem]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - name: Resolve ${{ matrix.extra }} without downloading it
        run: uv pip compile pyproject.toml --extra ${{ matrix.extra }} --quiet --output-file $RUNNER_TEMP/${{ matrix.extra }}.txt
